[project]
name = "sagittal"
version = "0.1.0"
description = "Tools for averaging sagittal slices"
readme = ""
requires-python = ">=3.9"
authors = [
    { name = "Group 22" }
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "nibabel",
]

[project.urls]
Homepage = "https://github.com/akn620/sagittal_average"

[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true